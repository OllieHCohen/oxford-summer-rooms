<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reservation confirmed — Oxford Summer Rooms</title>
  <link href="https://fonts.googleapis.com/css?family=Quicksand:400,500,600,700" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-966624333"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-966624333');
  </script>
</head>

<body>
  <main class="book">
    <div class="confirm" style="margin-top:48px">
      <h3>✓ Reservation confirmed</h3>
      <p>Thank you — your <strong>£100 holding deposit</strong> has been received and your room is now reserved. You’ll get a confirmation email shortly. The £100 goes towards your rent and is non-refundable.</p>
      <p class="hint" id="ref"></p>
      <p style="margin-top:16px"><a class="btn btn-ghost" href="index.html">← Back to all properties</a></p>
    </div>
  </main>

  <script src="common.js"></script>
  <script>
    const sid = param('session_id');
    if (sid) {
      document.getElementById('ref').textContent = 'Reference: ' + sid;
      // Google Ads conversion — fired only here, and only with a session_id
      // (Stripe Checkout redirects to this page solely after a successful
      // payment, so reaching it with a session_id means payment confirmed).
      // transaction_id = the Stripe session id, so a refresh of this page
      // can't double-count the same booking.
      gtag('event', 'conversion', {
        'send_to': 'AW-966624333/Nw91CJvw9dccEM2I9swD',
        'value': HOLDING_DEPOSIT, // the amount actually paid (£100 deposit)
        'currency': 'GBP',
        'transaction_id': sid
      });
    }
  </script>
  <!-- Default Statcounter code for Oxford Summer rooms http://www.oxfordsummerrooms.com -->
  <script type="text/javascript">
    var sc_project = 13299718;
    var sc_invisible = 1;
    var sc_security = "4dd251d8";
  </script>
  <script type="text/javascript" src="https://www.statcounter.com/counter/counter.js" async></script>
  <noscript><div class="statcounter"><a title="Web Analytics" href="https://statcounter.com/" target="_blank"><img class="statcounter" src="https://c.statcounter.com/13299718/0/4dd251d8/1/" alt="Web Analytics" referrerPolicy="no-referrer-when-downgrade"></a></div></noscript>
  <!-- End of Statcounter Code -->
</body>

</html>
